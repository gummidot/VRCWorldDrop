name: Build Release

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  packageName: com.gummidot.vrc-world-drop
  # VPM manifest lives inside the package folder (the folder is the package root).
  manifest: Assets/VRCWorldDrop/package.json

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Get version
        id: version
        run: |
          version=$(jq -r '.version' "$manifest")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Package version: $version"

      - name: Install tooling deps
        run: npm ci

      - name: Build .unitypackage
        run: npm run export

      - name: Build VPM zip
        run: |
          # The package folder IS the package root: package.json sits alongside
          # the assets, so the zip is just the folder's contents (flat layout).
          # VCC needs this zip + package.json on the release to list the version.
          mkdir -p staging
          cp -r Assets/VRCWorldDrop/. staging/
          rm -rf staging/Synced/_Temp staging/Synced/_Temp.meta
          cd staging
          zip -r "../${packageName}-${{ steps.version.outputs.version }}.zip" .
          cd ..

      - name: Extract changelog entry
        run: |
          # Pull the section for this version out of CHANGELOG.md (everything
          # between this version's "# x.y.z" heading and the next "# " heading)
          # to use as the release description.
          version="${{ steps.version.outputs.version }}"
          awk -v ver="$version" '
            index($0, "# " ver) == 1 { capture=1; next }
            /^# / && capture { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          echo "Release notes for $version:"
          cat release-notes.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: |
            ${{ env.packageName }}-${{ steps.version.outputs.version }}.zip
            VRCWorldDrop_v${{ steps.version.outputs.version }}.unitypackage
            ${{ env.manifest }}
